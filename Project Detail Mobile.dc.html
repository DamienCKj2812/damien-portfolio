<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#070707;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
a{color:#f2f0ea;text-decoration:underline;text-underline-offset:3px;}
a:hover{color:#ffffff;}
button{font:inherit;color:inherit;}
.scroller::-webkit-scrollbar{display:none;}
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 0;background:#070707;">
<div data-screen-label="Project detail" style="position:relative;width:390px;height:844px;overflow:hidden;background:#0c0c0b;color:#f2f0ea;font-family:'IBM Plex Sans',sans-serif;border:1px solid #1f1f1d;">

  <div class="scroller" ref="{{ scrollRef }}" style="position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding-bottom:110px;background:radial-gradient(120% 40% at 50% 0%, #1d1d1b 0%, #0c0c0b 70%);">

    <div style="position:sticky;top:0;z-index:5;background:rgba(12,12,11,0.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #1f1f1d;">
      <div style="display:flex;align-items:center;gap:12px;padding:10px 12px 10px 12px;">
        <button aria-label="Back to hallway" style="width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid #2c2c29;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:18px;" style-active="background:#1c1c1a;">←</button>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#8d8b85;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Projects / Case file</div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">01 Client Project</div>
        </div>
        <button aria-label="More" onClick="{{ toggleMenu }}" style="width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid #2c2c29;cursor:pointer;font-size:20px;letter-spacing:1px;" style-active="background:#1c1c1a;">⋯</button>
      </div>
      <sc-if value="{{ showProgress }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;gap:4px;padding:0 12px 10px;">
          <sc-for list="{{ segments }}" as="s" hint-placeholder-count="8">
            <button aria-label="{{ s.label }}" onClick="{{ s.select }}" style="flex:1;height:14px;padding:5px 0;background:transparent;border:none;cursor:pointer;">
              <div style="height:3px;background:{{ s.color }};"></div>
            </button>
          </sc-for>
        </div>
      </sc-if>
    </div>

    <div style="padding:16px 16px 0;">
      <div onClick="{{ togglePlay }}" style="position:relative;aspect-ratio:16/10;border:1px solid #2c2c29;background:repeating-linear-gradient(135deg,#151514 0 10px,#191918 10px 20px);cursor:pointer;overflow:hidden;">
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.1em;color:#6f6d68;text-transform:uppercase;">screen recording · {{ chapter.media }}</div>
        <div style="position:absolute;left:0;right:0;bottom:0;padding:28px 10px 8px;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,0.75) 100%);display:flex;align-items:center;gap:8px;">
          <button aria-label="{{ playLabel }}" onClick="{{ togglePlay }}" style="width:44px;height:44px;flex:none;border-radius:50%;background:#f2f0ea;color:#0c0c0b;border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;">{{ playIcon }}</button>
          <div onClick="{{ scrub }}" style="flex:1;height:44px;display:flex;align-items:center;cursor:pointer;">
            <div style="position:relative;width:100%;height:3px;background:rgba(242,240,234,0.25);">
              <div style="position:absolute;left:0;top:0;bottom:0;width:{{ progressPct }};background:#f2f0ea;"></div>
            </div>
          </div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#d6d4ce;white-space:nowrap;">{{ timeLabel }}</div>
          <button aria-label="{{ muteLabel }}" onClick="{{ toggleMute }}" style="width:44px;height:44px;flex:none;background:transparent;border:none;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.06em;color:#f2f0ea;">{{ muteText }}</button>
        </div>
      </div>
    </div>

    <div style="padding:28px 20px 0;display:flex;flex-direction:column;gap:14px;">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.14em;color:#8d8b85;text-transform:uppercase;">Chapter {{ chapter.num }} / {{ total }}</div>
      <h1 style="margin:0;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:26px;line-height:1.2;letter-spacing:-0.01em;text-wrap:balance;">{{ chapter.title }}</h1>
      <p style="margin:0;font-size:17px;line-height:1.5;color:#f2f0ea;text-wrap:pretty;">{{ chapter.lede }}</p>
    </div>

    <sc-if value="{{ hasStack }}" hint-placeholder-val="{{ true }}">
      <div style="padding:28px 20px 0;display:flex;flex-direction:column;gap:12px;">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;color:#8d8b85;text-transform:uppercase;">Stack</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;">
          <sc-for list="{{ chapter.stack }}" as="tag" hint-placeholder-count="8">
            <span style="font-family:'IBM Plex Mono',monospace;font-size:13px;padding:7px 10px;border:1px solid #2c2c29;background:#141413;color:#e4e2dc;">{{ tag }}</span>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <div style="padding:28px 20px 0;display:flex;flex-direction:column;gap:0;">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;color:#8d8b85;text-transform:uppercase;padding-bottom:12px;">Key decisions</div>
      <sc-for list="{{ chapter.points }}" as="p" hint-placeholder-count="3">
        <div style="display:grid;grid-template-columns:32px minmax(0,1fr);gap:4px 8px;padding:16px 0;border-top:1px solid #23231f;">
          <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8d8b85;padding-top:3px;">{{ p.n }}</div>
          <div style="display:flex;flex-direction:column;gap:4px;">
            <div style="font-size:16px;font-weight:600;line-height:1.35;">{{ p.t }}</div>
            <div style="font-size:15px;line-height:1.55;color:#b9b7b0;text-wrap:pretty;">{{ p.d }}</div>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="padding:20px 20px 0;">
      <button onClick="{{ goNext }}" style="width:100%;min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:#141413;border:1px solid #2c2c29;cursor:pointer;text-align:left;" style-active="background:#1c1c1a;">
        <div style="display:flex;flex-direction:column;gap:4px;min-width:0;">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;color:#8d8b85;text-transform:uppercase;">{{ nextKicker }}</span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500;">{{ nextTitle }}</span>
        </div>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:18px;">→</span>
      </button>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;z-index:6;background:rgba(12,12,11,0.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid #1f1f1d;padding:10px 12px 24px;display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:8px;">
    <button aria-label="Previous chapter" onClick="{{ goPrev }}" disabled="{{ atStart }}" style="height:52px;background:transparent;border:1px solid #2c2c29;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:18px;opacity:{{ prevOpacity }};">←</button>
    <button onClick="{{ openSheet }}" style="height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;background:#141413;border:1px solid #2c2c29;cursor:pointer;min-width:0;">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8d8b85;flex:none;">{{ chapter.num }}/{{ total }}</span>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left;">{{ chapter.title }}</span>
      <span style="font-size:11px;color:#8d8b85;flex:none;">▲</span>
    </button>
    <button aria-label="Next chapter" onClick="{{ goNext }}" disabled="{{ atEnd }}" style="height:52px;background:#f2f0ea;color:#0c0c0b;border:1px solid #f2f0ea;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:18px;opacity:{{ nextOpacity }};">→</button>
  </div>

  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ toggleMenu }}" style="position:absolute;inset:0;z-index:9;"></div>
    <div style="position:absolute;top:60px;right:12px;z-index:10;width:220px;background:#141413;border:1px solid #2c2c29;display:flex;flex-direction:column;box-shadow:0 12px 32px rgba(0,0,0,0.5);">
      <button onClick="{{ toggleMenu }}" style="min-height:48px;padding:0 16px;text-align:left;background:transparent;border:none;border-bottom:1px solid #23231f;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:13px;">Display settings</button>
      <button onClick="{{ toggleMenu }}" style="min-height:48px;padding:0 16px;text-align:left;background:transparent;border:none;border-bottom:1px solid #23231f;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:13px;">Help &amp; controls</button>
      <button onClick="{{ toggleMenu }}" style="min-height:48px;padding:0 16px;text-align:left;background:transparent;border:none;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:13px;">Back to hallway</button>
    </div>
  </sc-if>

  <sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeSheet }}" style="position:absolute;inset:0;z-index:11;background:rgba(0,0,0,0.6);"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;z-index:12;background:#121211;border-top:1px solid #2c2c29;padding:8px 0 24px;display:flex;flex-direction:column;">
      <div style="width:36px;height:4px;background:#3a3a36;margin:4px auto 10px;"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:0 12px 8px 20px;">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;color:#8d8b85;text-transform:uppercase;">Chapters</span>
        <button aria-label="Close" onClick="{{ closeSheet }}" style="width:44px;height:44px;background:transparent;border:none;cursor:pointer;font-size:18px;">✕</button>
      </div>
      <sc-for list="{{ chapterRows }}" as="c" hint-placeholder-count="8">
        <button onClick="{{ c.select }}" style="min-height:52px;display:grid;grid-template-columns:40px minmax(0,1fr) 16px;align-items:center;gap:8px;padding:0 20px;background:{{ c.bg }};border:none;border-top:1px solid #1f1f1d;cursor:pointer;text-align:left;">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8d8b85;">{{ c.num }}</span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:14px;color:{{ c.color }};">{{ c.title }}</span>
          <span style="font-size:10px;color:#f2f0ea;">{{ c.mark }}</span>
        </button>
      </sc-for>
    </div>
  </sc-if>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:900},&quot;autoplay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showProgress&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Navigation&quot;}}">
const CHAPTERS = [
  { num: '01', title: 'Overview', media: 'site walkthrough', lede: 'A bilingual marketing site and CMS for a client who needed to publish without developer help.', points: [
    { t: 'Editors own the content', d: 'Every page section is managed in the CMS, so routine updates no longer need a release.' },
    { t: 'Two locales from day one', d: 'English and Chinese share one content model instead of two parallel sites.' } ] },
  { num: '02', title: 'The problem', media: 'legacy site', lede: 'The old site was hard-coded, slow to update and inconsistent across languages.', points: [
    { t: 'Every edit was a deploy', d: 'Copy changes queued behind developer availability.' },
    { t: 'Locales drifted apart', d: 'Translated pages fell out of sync with the source content.' } ] },
  { num: '03', title: 'Role & team', media: 'team board', lede: 'I led architecture and full-stack build, working with a designer and the client’s content team.', points: [
    { t: 'End-to-end ownership', d: 'Frontend, CMS schema, infrastructure and deployment pipeline.' } ] },
  { num: '04', title: 'Research', media: 'editor interviews', lede: 'Interviews with editors shaped the content model before any UI was built.', points: [
    { t: 'Model around tasks', d: 'Content types mirror how editors think about pages, not how the code is structured.' } ] },
  { num: '05', title: 'Architecture & workflow', media: 'system diagram', lede: 'A headless CMS feeds a server-rendered frontend, deployed through a scripted pipeline.', points: [
    { t: 'Headless by design', d: 'Strapi exposes content; Next.js renders it on the server.' },
    { t: 'Repeatable environments', d: 'Docker Compose and Ansible keep staging and production identical.' } ] },
  { num: '06', title: 'Technology & decisions', media: 'cms editor', lede: 'A typed, server-first stack chosen for security, locale handling and a calm editing experience.',
    stack: ['Next.js App Router', 'React', 'TypeScript', 'Tailwind CSS v4', 'Strapi 5', 'PostgreSQL', 'Docker Compose', 'PM2', 'Ansible', 'GitHub Actions'],
    points: [
    { t: 'Server-side CMS access', d: 'Privileged API tokens stay on the server and never ship in browser code.' },
    { t: 'Locale-aware caching', d: 'Cached responses are keyed per locale, so translations never leak between languages.' },
    { t: 'Shared content model', d: 'One schema separates editorial content from presentation across both locales.' } ] },
  { num: '07', title: 'Challenges & solutions', media: 'before / after', lede: 'The hardest parts were cache invalidation and keeping previews accurate for editors.', points: [
    { t: 'Stale pages after publish', d: 'CMS webhooks trigger targeted revalidation instead of full rebuilds.' },
    { t: 'Unreliable previews', d: 'A draft-mode route renders unpublished content with the real layout.' } ] },
  { num: '08', title: 'Outcome', media: 'live site', lede: 'Editors now publish independently in both languages, and releases are routine.', points: [
    { t: 'Self-serve publishing', d: 'Content updates ship without involving a developer.' } ] },
];
const DUR = 49;
const fmt = s => `0:${String(Math.floor(s)).padStart(2, '0')}`;

class Component extends DCLogic {
  state = { idx: 5, playing: true, t: 31, muted: true, sheetOpen: false, menuOpen: false };
  scrollRef = React.createRef();

  componentDidMount() {
    if (this.props.autoplay === false) this.setState({ playing: false });
    this.timer = setInterval(() => {
      if (!this.state.playing) return;
      this.setState(s => ({ t: s.t + 1 >= DUR ? 0 : s.t + 1 }));
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.timer); }

  go(i) {
    if (i < 0 || i >= CHAPTERS.length) return;
    this.setState({ idx: i, t: 0, playing: this.props.autoplay !== false, sheetOpen: false });
    if (this.scrollRef.current) this.scrollRef.current.scrollTop = 0;
  }

  renderVals() {
    const { idx, playing, t, muted, sheetOpen, menuOpen } = this.state;
    const ch = CHAPTERS[idx];
    const next = CHAPTERS[idx + 1];
    return {
      scrollRef: this.scrollRef,
      chapter: { ...ch, points: ch.points.map((p, i) => ({ ...p, n: String(i + 1).padStart(2, '0') })) },
      total: String(CHAPTERS.length).padStart(2, '0'),
      hasStack: !!ch.stack,
      showProgress: this.props.showProgress ?? true,
      segments: CHAPTERS.map((c, i) => ({ label: c.title, color: i <= idx ? '#f2f0ea' : '#2c2c29', select: () => this.go(i) })),
      chapterRows: CHAPTERS.map((c, i) => ({ ...c, bg: i === idx ? '#1c1c1a' : 'transparent', color: i === idx ? '#f2f0ea' : '#b9b7b0', mark: i === idx ? '●' : '', select: () => this.go(i) })),
      playIcon: playing ? '❚❚' : '▶',
      playLabel: playing ? 'Pause video' : 'Play video',
      togglePlay: e => { e && e.stopPropagation(); this.setState(s => ({ playing: !s.playing })); },
      toggleMute: e => { e.stopPropagation(); this.setState(s => ({ muted: !s.muted })); },
      muteText: muted ? 'MUTED' : 'SOUND',
      muteLabel: muted ? 'Turn sound on' : 'Turn sound off',
      scrub: e => { e.stopPropagation(); const r = e.currentTarget.getBoundingClientRect(); this.setState({ t: Math.max(0, Math.min(DUR - 1, ((e.clientX - r.left) / r.width) * DUR)) }); },
      progressPct: `${(t / DUR) * 100}%`,
      timeLabel: `${fmt(t)} / ${fmt(DUR)}`,
      goPrev: () => this.go(idx - 1),
      goNext: () => this.go(next ? idx + 1 : 0),
      atStart: idx === 0, atEnd: !next,
      prevOpacity: idx === 0 ? 0.35 : 1,
      nextOpacity: next ? 1 : 0.35,
      nextKicker: next ? `Next · ${next.num}` : 'Back to start',
      nextTitle: next ? next.title : CHAPTERS[0].title,
      sheetOpen, menuOpen,
      openSheet: () => this.setState({ sheetOpen: true, menuOpen: false }),
      closeSheet: () => this.setState({ sheetOpen: false }),
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
    };
  }
}
</script>
</body>
</html>
