<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mobile HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#040404;overflow:hidden;font-family:'JetBrains Mono',ui-monospace,monospace;color:#e8e8e4;-webkit-tap-highlight-color:transparent}
a{color:#8c8c88;text-decoration:none}a:hover{color:#fff}
.hud{position:fixed;inset:0;text-shadow:0 0 12px rgba(0,0,0,.9)}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:42% 50%}
.scrim-top{position:absolute;left:0;right:0;top:0;height:120px;pointer-events:none;background:linear-gradient(180deg,rgba(4,4,4,.85),rgba(4,4,4,0))}
.scrim-bot{position:absolute;left:0;right:0;bottom:0;height:110px;pointer-events:none;background:linear-gradient(0deg,rgba(4,4,4,.9) 0%,rgba(4,4,4,.5) 50%,rgba(4,4,4,0) 100%)}
.top{position:absolute;top:calc(16px + env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:flex-end}
.cluster{display:flex;border:1px solid rgba(255,255,255,.18);background:rgba(4,4,4,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.cluster .div{width:1px;background:rgba(255,255,255,.14)}
.btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:#e8e8e4;background:transparent;border:0;font-family:inherit;padding:0}
.btn.active{background:#e8e8e4;color:#040404}
.btn.active circle{fill:#e8e8e4}
.dock{position:absolute;left:16px;right:16px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:4px}
.dock-row{display:flex;align-items:center;justify-content:flex-end}
.sound{width:44px;height:36px;margin-right:-12px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#e8e8e4;background:none;border:0;padding:0}
.sound.off{color:#6f6f6b}
.eq{display:flex;align-items:flex-end;gap:2px;height:12px}
.eq span{width:2px;height:2px;background:currentColor;transition:height .18s linear}
.track{position:relative;height:14px}
.track .line{position:absolute;left:0;right:0;top:6px;height:1px;background:rgba(255,255,255,.2)}
.track .fill{position:absolute;left:0;top:6px;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.3),#fff);box-shadow:0 0 8px rgba(255,255,255,.6);transition:width .4s}
.stop{position:absolute;top:-8px;width:28px;height:30px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;cursor:pointer;background:none;border:0;padding:0}
.stop span{width:3px;height:3px;border-radius:50%;background:#5f5f5b;transition:all .3s}
.stop.past span{background:#fff}
.stop.cur span{width:7px;height:7px;background:#fff;box-shadow:0 0 10px #fff}
.shade{position:absolute;inset:0;background:rgba(4,4,4,.55);opacity:0;pointer-events:none;transition:opacity .3s}
.sheet{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.18);background:rgba(6,6,6,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transform:translateY(24px);opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.2,.7,.2,1),opacity .3s}
.open .shade{opacity:1;pointer-events:auto}
.open .sheet{transform:none;opacity:1;pointer-events:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 4px 16px;border-bottom:1px solid rgba(255,255,255,.1);font-size:10px;letter-spacing:.24em;color:#8c8c88}
.row{height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.07);font-size:11px;letter-spacing:.2em}
.seg{display:flex;gap:14px;font-size:10px}
.seg span{color:#6f6f6b;padding-bottom:3px;border-bottom:1px solid transparent}
.seg span.on{color:#fff;border-bottom-color:#fff}
.credit{padding:16px;display:flex;justify-content:space-between;font-size:9px;letter-spacing:.18em}
</style>
</head>
<body>
<div class="hud" id="hud">
  <img class="bg" src="room-tower.png" alt="">
  <div class="scrim-top"></div>
  <div class="scrim-bot"></div>

  <div class="top">
    <div class="cluster">
      <button class="btn" id="setBtn" aria-label="Settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1"><path d="M2 4h12M2 8h12M2 12h12"/><circle cx="5" cy="4" r="1.6" fill="#040404"/><circle cx="10.5" cy="8" r="1.6" fill="#040404"/><circle cx="7" cy="12" r="1.6" fill="#040404"/></svg>
      </button>
      <div class="div"></div>
      <button class="btn" aria-label="Help">?</button>
      <div class="div"></div>
      <a class="btn" href="#" aria-label="Open link">↗</a>
    </div>
  </div>

  <div class="dock">
    <div class="dock-row">
      <button class="sound" id="soundBtn" aria-label="Toggle sound"><div class="eq" id="eq"><span></span><span></span><span></span><span></span></div></button>
    </div>
    <div class="track" id="track"><div class="line"></div><div class="fill" id="fill"></div></div>
  </div>

  <div class="shade" id="shade"></div>
  <div class="sheet" role="dialog" aria-label="Settings">
    <div class="sheet-head"><span>SETTINGS</span><button class="btn" id="closeBtn" aria-label="Close" style="font-size:14px">×</button></div>
    <div class="row" data-key="music"><span>MUSIC</span><div class="seg"><span>ON</span><span>OFF</span></div></div>
    <div class="row" data-key="sfx"><span>SFX</span><div class="seg"><span>ON</span><span>OFF</span></div></div>
    <a class="credit" href="#"><span>♪ CYBERPUNK SUSPENSE — LEBERCH</span><span>↗</span></a>
  </div>
</div>
<script>
const names=['START','TRAIN PASS','DOORS','ENTRANCE','LOBBY','ESCALATOR','ELEVATOR','CABIN'];
const S={p:3/7,music:true,sfx:true,t:0,sheet:false};
const $=id=>document.getElementById(id), last=names.length-1;
const track=$('track');
names.forEach((n,i)=>{const b=document.createElement('button');b.className='stop';b.style.left=(i/last*100)+'%';b.setAttribute('aria-label',n);b.innerHTML='<span></span>';b.onclick=()=>{S.p=i/last;render()};track.appendChild(b)});
document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{S[r.dataset.key]=!S[r.dataset.key];render()});
$('soundBtn').onclick=()=>{S.music=!S.music;render()};
$('setBtn').onclick=()=>{S.sheet=!S.sheet;render()};
$('closeBtn').onclick=$('shade').onclick=()=>{S.sheet=false;render()};
function render(){
  const cur=Math.round(S.p*last);
  $('fill').style.width=(S.p*100)+'%';
  track.querySelectorAll('.stop').forEach((s,i)=>{s.classList.toggle('cur',i===cur);s.classList.toggle('past',i<cur)});
  $('soundBtn').classList.toggle('off',!S.music);
  $('setBtn').classList.toggle('active',S.sheet);
  $('hud').classList.toggle('open',S.sheet);
  document.querySelectorAll('.row').forEach(r=>{const on=S[r.dataset.key],[a,b]=r.querySelectorAll('.seg span');a.classList.toggle('on',on);b.classList.toggle('on',!on)});
  [...$('eq').children].forEach((b,i)=>b.style.height=S.music?(3+Math.round((Math.sin(S.t*.9+i*1.7)*.5+.5)*9))+'px':'2px');
}
setInterval(()=>{if(S.music){S.t++;render()}},180);
render();
</script>
</body>
</html>
